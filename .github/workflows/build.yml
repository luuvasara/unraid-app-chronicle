name: Build index

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # commit state/
      pages: write      # deploy the index
      id-token: write   # required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Build
        env:
          INDEX_GIT_TOKEN: ${{ github.token }}
        run: python3 build.py --jobs 8 --state state --changes changes --out public --work "$RUNNER_TEMP/work"
      - name: Save the app list, changelog and per-repository parts
        # The parts let the next run rebuild only repositories whose branch moved. The commit is also
        # repository activity, which keeps the schedule enabled (GitHub disables scheduled workflows
        # in a public repository after 60 days without activity).
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state changes
          git diff --cached --quiet || git commit -q -m "Index state $(date -u +%F)"
          git push -q origin HEAD:main
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
